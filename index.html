<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
            name="description"
            content="ExploMonde permet de rechercher des informations sur les pays du monde."
    >

    <title>ExploMonde - Recherche de pays</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

<a href="#contenu">Aller au contenu principal</a>

<header>
    <h1>ExploMonde</h1>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Pays</a>
    </nav>
</header>

<main id="contenu">

    <section>
        <h2>Rechercher un pays</h2>

        <label for="recherche">Nom du pays :</label>

        <input
                type="text"
                id="recherche"
                placeholder="Exemple : France"
        >

        <button id="reessayer">Réessayer</button>
    </section>

    <section>
        <h2>Résultats</h2>

        <div id="statut" role="status"></div>

        <div id="resultats"></div>
    </section>

</main>

<footer>
    <p>ExploMonde - 2026</p>
</footer>

<script type="module" src="js/main.js"></script>

</body>
</html>
